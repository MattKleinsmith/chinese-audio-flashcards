name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/chinese-listening-flashcards-4kse61]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      # Stamp the build: sw.js SHELL_VERSION (cache bust) and the version shown in Settings → About.
      - run: sed -i "s/__BUILD_SHA__/${GITHUB_SHA::7}/" site/sw.js site/index.html
      - uses: actions/configure-pages@v5
        with: { enablement: true }  # tries to enable Pages automatically; if it fails, enable once in Settings → Pages (Source: GitHub Actions)
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
